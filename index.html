<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Eclipse — Золотая миля, Марбелья</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4efe7;--card:#fffdf9;--ink:#1d1a17;--mute:#7b7268;--line:#e2d9cc;--bronze:#9a7650;--on:#1d1a17;--onink:#f4efe7;--soft:#ebe3d6}
body.night{--bg:#14161b;--card:#1d2027;--ink:#f1ebe1;--mute:#9a958c;--line:#2e323b;--bronze:#c9a67c;--on:#f1ebe1;--onink:#14161b;--soft:#232730}
html,body{min-height:100%}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);transition:background .9s,color .9s;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.01em}
.app{max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 8px;transition:background .9s}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-size:15px;letter-spacing:.34em;text-decoration:none;white-space:nowrap}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--mute);white-space:nowrap}
.sp{flex:1}
.lang{display:flex;flex:none}.lang button{font-size:12px;padding:8px 5px;color:var(--mute);cursor:pointer}.lang button.on{color:var(--ink);font-weight:600}
.ecl{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);position:relative;overflow:hidden;background:var(--card)}
.ecl i{position:absolute;inset:8px;border-radius:50%;background:var(--bronze)}
.ecl b{position:absolute;inset:8px;border-radius:50%;background:var(--card);transform:translateX(125%);transition:transform .9s cubic-bezier(.6,0,.2,1)}
body.night .ecl b{transform:translateX(26%)}
.crumbs{font-size:12px;color:var(--mute);margin-top:6px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.crumbs a{text-decoration:none}.crumbs span.cur{color:var(--ink);font-weight:600}
main{flex:1;padding:16px 16px 100px}
h1{font-size:34px;line-height:1.08;margin-bottom:8px}
h2{font-size:24px;line-height:1.15;margin-bottom:10px}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);margin:22px 0 9px;font-weight:600}
p.lead{color:var(--mute);margin-bottom:12px;max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;text-decoration:none;text-align:center}
.btn.pri{background:var(--on);color:var(--onink);border-color:var(--on)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;font-weight:500;border-radius:10px}
.btn.on{background:var(--on);color:var(--onink);border-color:var(--on)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}.row.fill>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font-size:22px;font-weight:400}.stat span{font-size:12px;color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips .btn{white-space:nowrap;flex:none}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-align:left;width:100%;text-decoration:none}
.li .t{flex:1}.li .m{font-size:12px;color:var(--mute)}.li b{white-space:nowrap;font-weight:600}
.note{font-size:12px;color:var(--mute);margin-top:10px}
.pic{position:relative;border-radius:16px;overflow:hidden;background:var(--soft)}
.pic img,.pic video{width:100%;height:100%;object-fit:cover;display:block}
.pic .cap{position:absolute;left:12px;bottom:10px;font-size:11px;letter-spacing:.06em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
/* день и ночь: затмение */
.hero{aspect-ratio:4/5;max-height:72vh;width:100%}
.hero img{position:absolute;inset:0}
.hero .nightimg{clip-path:circle(0% at 88% 6%);transition:clip-path 1.4s cubic-bezier(.6,0,.2,1)}
body.night .hero .nightimg{clip-path:circle(160% at 88% 6%)}
.hero .ttl{position:absolute;left:18px;right:18px;bottom:18px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.hero .ttl h1{font-size:44px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.5));pointer-events:none}
.hero .ttl{z-index:2}
/* здание */
.bld{display:flex;flex-direction:column;gap:5px;max-width:640px;margin:0 auto}
.fl{display:flex;align-items:stretch;gap:6px}
.fl>.lab{width:48px;font-size:11px;color:var(--mute);display:flex;align-items:center;text-align:left}
.fl>.us{flex:1;display:flex;gap:4px}
.u{min-height:46px;border-radius:7px;background:var(--soft);border:1px solid var(--line);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:3px;min-width:0}
.u b{font-weight:600}
.u.dim{opacity:.22}.u.sold{background:transparent;border-style:dashed;color:var(--mute)}.u.res{background:color-mix(in srgb,var(--bronze) 28%,var(--soft))}
.u.hit{outline:2px solid var(--bronze);outline-offset:-1px}
.fl.f5 .us{padding:0 9%}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
.plan{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:auto}
.plan img{width:100%;min-width:560px}
/* квартира */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.facts b{display:block;font-size:19px;font-weight:400}.facts span{font-size:11px;color:var(--mute)}
.price{font-size:30px}
.st{font-size:10px;border-radius:20px;padding:3px 10px;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.st.free{border-color:var(--bronze);color:var(--bronze)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:10px;font-size:13px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--bronze);font-weight:600}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.thumbs button{flex:none;width:92px;border-radius:9px;overflow:hidden;border:2px solid transparent;opacity:.75}
.thumbs button.on{border-color:var(--bronze);opacity:1}
.thumbs img{aspect-ratio:16/10;object-fit:cover;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);cursor:pointer;font-weight:600}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
tr.dim td{opacity:.3}
tr.rowlink{cursor:pointer}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.bot a{flex:1;text-align:center;text-decoration:none;font-size:11px;color:var(--mute);padding:6px 2px;border-radius:8px}
nav.bot a b{display:block;font-size:17px;font-weight:400;line-height:1.15}
nav.bot a.on{color:var(--ink);font-weight:600}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{display:flex;align-items:center}
label.f{display:block;font-size:12px;color:var(--mute);margin:14px 0 6px}
input[type=range]{width:100%;accent-color:var(--bronze)}
input[type=text]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 13px;font:inherit;background:var(--bg);color:var(--ink)}
.agent{border:1px dashed var(--bronze)}
.foot{font-size:11px;color:var(--mute);margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
@media(min-width:900px){
  main{padding:26px 26px 50px}
  nav.bot{position:static;border:0;background:none;backdrop-filter:none;padding:0;gap:2px}
  nav.bot a{flex:none;padding:6px 11px;font-size:13px}nav.bot a b{display:none}
  .two{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
  .veil{align-items:center}.sheet{border-radius:18px}
  h1{font-size:44px}.hero{aspect-ratio:16/9;max-height:none}.hero .ttl h1{font-size:64px}
}
</style>
</head>

"unit":id=>{const u=U(id);if(!u)return go("#/building");const a=agent(),T=DOM.types[u.type];crumbs([[t("nav_area"),"#/area"],[t("nav_building"),"#/building"],[FLN(u.floor),"#/floor/"+u.floor],[APT(u)]]);nav("#/building");

   pay:`<table><tr><td>${t("pay_res")}</td><td>${eur(20000)}</td></tr><tr><td>${t("pay_contract")}</td><td>${eur(u.price*.3)}</td></tr><tr><td>${t("pay_build")}</td><td>${eur(u.price*.2)}</td></tr><tr><td>${t("pay_done")}</td><td>${eur(u.price*.5)}</td></tr></table>`,
   costs:`<table><tr><td>${t("cost_fee")}</td><td>${eur(u.fee_month)} ${t("per_month")}</td></tr><tr><td>${t("cost_tax")}</td><td>${eur(u.price*.0006)} ${t("per_month")}</td></tr></table>`,
   incl:`<div class="list"><div class="li">${t("incl_kitchen")}</div><div class="li">${t("incl_parking")}</div><div class="li">${t("incl_storage")}</div></div>`};
  if(!tabs[S.tab])S.tab="plan";
  main.innerHTML=`<div class="two"><div><div class="pic" style="aspect-ratio:16/10">${sh[2]?`<video src="${sh[2]}" poster="img/${sh[0]}.jpg" autoplay loop muted playsinline aria-label="${D(sh[1])}"></video>`:`<img src="img/${sh[0]}.jpg" alt="${D(sh[1])}">`}<div class="cap">${D(sh[1])}${u.type=="PH"?(u.id=="PH1"?"":t("shownPH1")):(u.id=="3C"?"":t("shown3c"))}</div></div>
  <div class="thumbs">${shots.map((s,i)=>`<button class="${i==S.shot?"on":""}" onclick="S.shot=${i};draw()" aria-label="${D(s[1])}"><img src="img/${s[0]}-s.jpg" alt=""></button>`).join("")}</div>
  ${own?"":`<p class="note">${t("int_note")}</p>`}</div>
  <div><div class="row" style="align-items:center;margin-top:14px"><h1 class="serif" style="margin:0">${APT(u)}</h1><span class="st ${u.status}">${STN(u.status)}</span></div>
  <p class="lead" style="margin-top:6px">${D(u.type_name)}${u.floor==5?"":" · "+FLN(u.floor)} · ${D(u.side)} · ${D(u.view)}</p>

  ${u.garden?`<p class="note" style="margin:0 0 8px">${t("garden",Math.round(u.garden))}</p>`:""}
  <div class="price serif">${eur(u.price)}</div>
  <div class="row fill" style="margin-top:12px">${walkOk?`<a class="btn pri" href="${tourHref()}">${t("tour")}</a><a class="btn" href="${walkHref()}">${t("plan3d")}</a>`:u.type=="PH"?`<a class="btn pri" href="${tourHref()}&u=ph">${t("tourPH")}</a>`:`<button class="btn pri" disabled>${t("tour_soon")}</button>`}<button class="btn" onclick="go('#/terrace/${u.id}')">${t("terr_view")}</button></div>
  ${walkOk?(u.id=="3C"?"":`<p class="note">${t("tour_note3c")}</p>`):(u.type=="PH"?(u.id=="PH1"?"":`<p class="note">${t("tour_notePH")}</p>`):`<p class="note">${t("tour_none")}</p>`)}
  <div class="row" style="margin-top:10px"><button class="btn sm ${fav?"on":""}" onclick="tog('fav','${u.id}')">${fav?t("fav_on"):t("fav_off")}</button><button class="btn sm ${cmp?"on":""}" onclick="tog('cmp','${u.id}')">${cmp?t("cmp_on"):t("cmp_off")}</button><button class="btn sm" onclick="share('${u.id}')">${t("share")}</button></div>
  <div class="card ${a?"agent":""}" style="margin-top:14px"><div style="font-size:12px;color:var(--mute)">${a?t("your_agent"):t("sales")}</div><b>${a?esc(a):t("contact_ph")}</b>
  <div class="row fill" style="margin-top:8px"><button class="btn sm" onclick="go('#/contact/${u.id}')">${t("book")}</button></div></div>
  <div class="tabs">${Object.keys(tabs).map(k=>`<button class="${k==S.tab?"on":""}" onclick="S.tab='${k}';draw(true)">${t("tab_"+k)}</button>`).join("")}</div>${tabs[S.tab]}</div></div>${foot()}`},
"terrace":id=>{const u=U(id);if(!u)return go("#/building");crumbs([[t("nav_building"),"#/building"],[APT(u),"#/unit/"+u.id],[t("terrace")]]);nav("#/building");const tm=low(t("t_"+S.time));
  if(u.floor==5){main.innerHTML=`<div class="pic" style="aspect-ratio:16/9;max-height:74vh"><video src="vid/v/ph-vid.mp4" poster="img/ph-vid.jpg" autoplay loop muted playsinline aria-label="${t("terr_alt",low(t("t_sunset")))}"></video><div class="cap">${t("terr_cap",low(t("t_sunset")))}</div></div>

  main.innerHTML=`<div class="pic" style="aspect-ratio:16/9;max-height:74vh"><video src="vid/v/${S.time}.mp4" poster="img/${VIEWS[S.time]}.jpg" autoplay loop muted playsinline aria-label="${t("terr_alt",tm)}"></video><div class="cap">${t("terr_cap",tm)}</div></div>
  <div class="row" style="margin-top:12px;align-items:center">${Object.keys(VIEWS).map(k=>`<button class="btn sm ${k==S.time?"on":""}" onclick="setTime('${k}')">${t("t_"+k)}</button>`).join("")}<span class="sp"></span><a class="btn sm" href="vid/index.html?lang=${LANG}&t=${S.time}">${t("fullscreen")}</a></div>
  <p class="lead" style="margin-top:12px">${t("terr_lead",FLN(u.floor),num(u.eye),low(D(u.side)))}</p>

  <div class="row fill" style="margin-top:14px"><button class="btn" onclick="go('#/unit/${u.id}')">${t("back_apt")}</button><button class="btn pri" onclick="go('#/contact/${u.id}')">${t("book")}</button></div>${foot()}`},
"list":()=>{crumbs([[t("nav_building"),"#/building"],[t("nav_list")]]);nav("#/list");const cols=[["id",t("c_no")],["floor",t("c_floor")],["bed",t("c_beds")],["area",t("m2")],["terrace",t("c_terr")],["view",t("c_view")],["price",t("c_price")],["status",t("c_status")]];
  const rows=[...UNITS].sort((a,b)=>(a[S.sort]>b[S.sort]?1:a[S.sort]<b[S.sort]?-1:0)*S.dir);
  main.innerHTML=`<h2 class="serif">${t("all_apts")}</h2>${fbar()}<div class="scroll"><table><tr>${cols.map(([c,n])=>`<th onclick="S.dir=S.sort=='${c}'?-S.dir:1;S.sort='${c}';draw(true)">${n}${S.sort==c?(S.dir>0?" ↑":" ↓"):""}</th>`).join("")}</tr>
  ${rows.map(u=>`<tr class="rowlink ${active()&&!pass(u)?"dim":""}" onclick="go('#/unit/${u.id}')"><td><b>${u.id}</b></td><td>${u.floor==5?t("ph"):u.floor}</td><td>${u.bed}</td><td>${num(u.area)}</td><td>${num(u.terrace)}</td><td>${D(u.view)}</td><td>${eur(u.price)}</td><td>${STN(u.status)}</td></tr>`).join("")}</table></div>
  <p class="note">${t("list_note")}</p>${foot()}`},
"fav":()=>{crumbs([[t("nav_fav")]]);nav("#/fav");const f=S.fav.map(U).filter(Boolean),c=S.cmp.map(U).filter(Boolean);
  main.innerHTML=`<h2 class="serif">${t("nav_fav")}</h2>${f.length?`<div class="list">${f.map(u=>`<button class="li" onclick="go('#/unit/${u.id}')"><span class="t"><b>${u.id}</b> · ${D(u.type_name)}<div class="m">${FLN(u.floor)} · ${D(u.view)}</div></span><b>${eur(u.price)}</b></button>`).join("")}</div>`:`<p class="lead">${t("fav_empty")}</p>`}
  <h3>${t("compare_h")}</h3>${c.length?`<div class="scroll"><table><tr><th></th>${c.map(u=>`<th>${u.id}</th>`).join("")}</tr>${[[t("c_floor"),u=>FLN(u.floor)],[t("c_beds"),u=>u.bed],[t("c_area"),u=>num(u.area)+" "+t("m2")],[t("c_terr"),u=>num(u.terrace)+" "+t("m2")],[t("c_view"),u=>D(u.view)],[t("c_price"),u=>eur(u.price)],[t("c_month"),u=>eur(u.fee_month)],[t("c_status"),u=>STN(u.status)]].map(([n,fn])=>`<tr><td>${n}</td>${c.map(u=>`<td>${fn(u)}</td>`).join("")}</tr>`).join("")}</table></div>`:`<p class="lead">${t("cmp_empty")}</p>`}
  <div class="row fill" style="margin-top:14px"><button class="btn pri" onclick="go('#/building')">${t("choose")}</button></div>${foot()}`},
"more":()=>{crumbs([[t("nav_more")]]);nav("#/more");main.innerHTML=`<h2 class="serif">${t("nav_more")}</h2><div class="list"><button class="li" onclick="go('#/contact')"><span class="t">${t("contact")}</span></button><button class="li" onclick="go('#/dev')"><span class="t">${t("dev")}<div class="m">${t("dev_sub")}</div></span></button><a class="li" href="${PL()}razrez.svg" target="_blank"><span class="t">${t("section")}</span></a><a class="li" href="${tourHref()}&u=ph"><span class="t">${t("tourPH1")}<div class="m">${t("tourPH_sub")}</div></span></a><a class="li" href="${tourHref()}"><span class="t">${t("tour3c")}<div class="m">${t("tour_sub")}</div></span></a><a class="li" href="${walkHref()}"><span class="t">${t("walk3c")}<div class="m">${t("walk_sub")}</div></span></a></div>${foot()}`},
"dev":()=>{crumbs([[t("nav_more"),"#/more"],[t("dev")]]);nav("#/more");const V=u=>20+((u.floor*37+u.x0*13+u.area*3)%97|0)+(u.floor==5?60:0),mx=Math.max(...UNITS.map(V));
  main.innerHTML=`<h2 class="serif">${t("dev")}</h2><p class="lead">${t("dev_lead")}</p>
  <h3>${t("dev_map")}</h3><div class="card"><div class="bld">${[5,4,3,2,1].map(f=>`<div class="fl f${f}"><span class="lab">${FLS(f)}</span><div class="us">${UNITS.filter(u=>u.floor==f).map(u=>`<button class="u" style="flex:${DOM.types[u.type].W};background:color-mix(in srgb,var(--bronze) ${Math.round(8+82*V(u)/mx)}%,var(--card))" onclick="go('#/unit/${u.id}')"><b>${u.id}</b><span>${V(u)}</span></button>`).join("")}</div></div>`).join("")}</div></div>

function tog(k,id){const a=S[k],i=a.indexOf(id);if(i>=0)a.splice(i,1);else{if(k=="cmp"&&a.length>=3)return msg(t("cmp_max"));a.push(id)}save();draw(true)}
function share(id){const url=location.href.split("#")[0]+"#/unit/"+id+q();(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>msg(t("copied",id)),()=>msg(url))}
function setNight(n){document.body.classList.toggle("night",n)}
function setTime(k){S.time=k;setNight(k=="night");draw(true)}
function sheet(h){$("#sheet").innerHTML=h;$("#veil").classList.add("on")}
function closeSheet(){$("#veil").classList.remove("on")}
function msg(s){sheet(`<h2 class="serif">Eclipse<span class="sp"></span><button class="btn sm" onclick="closeSheet()">✕</button></h2><p class="lead" style="word-break:break-word">${esc(s)}</p>`)}
function filter(){sheet(`<h2 class="serif">${t("filter")}<span class="sp"></span><button class="btn sm" onclick="closeSheet()">✕</button></h2>
  <label class="f">${t("f_beds")}</label><div class="row">${[0,2,3,4].map(n=>`<button class="btn sm ${S.beds==n?"on":""}" onclick="S.beds=${n};filter();draw(true)">${n||t("any")}</button>`).join("")}</div>
  <label class="f">${t("budget")} <b>${S.max?eur(S.max):t("nolimit")}</b></label><input type="range" min="0" max="8000000" step="250000" value="${S.max}" oninput="S.max=+this.value;this.previousElementSibling.querySelector('b').textContent=S.max?eur(S.max):t('nolimit');draw(true);cnt()">
  <label class="f">${t("extra")}</label><div class="row"><button class="btn sm ${S.sea?"on":""}" onclick="S.sea=!S.sea;filter();draw(true)">${t("sea_open")}</button><button class="btn sm ${S.free?"on":""}" onclick="S.free=!S.free;filter();draw(true)">${t("only_free")}</button></div>
  <div class="row fill" style="margin-top:18px"><button class="btn" onclick="S.beds=0;S.max=0;S.sea=S.free=false;filter();draw(true)">${t("reset")}</button><button class="btn pri" id="cnt" onclick="closeSheet()">${t("show",UNITS.filter(pass).length)}</button></div>`)}
function cnt(){const b=$("#cnt");if(b)b.textContent=t("show",UNITS.filter(pass).length)}
function draw(keep){const y=scrollY,h=location.hash.replace(/^#\/?/,"").split("?")[0].split("/");(R[h[0]]||R[""])(h[1]);if(keep)scrollTo(0,y)}
$("#ecl").onclick=()=>{const n=!night();setNight(n);S.time=n?"night":"sunset";const h=location.hash;if(/terrace|building/.test(h))draw(true)};
$("#veil").onclick=e=>{if(e.target.id=="veil")closeSheet()};
addEventListener("hashchange",()=>{closeSheet();S.shot=0;draw();scrollTo(0,0)});
chrome();main.innerHTML=`<p class="lead">${t("loading")}</p>`;
Promise.all(["data/kvartiry.json","data/dom.json","data/mesta.json"].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+" "+r.status);return r.json()}))).then(([u,d,m])=>{UNITS=u;DOM=d;for(const p of m)(PLACES[p.cat]=PLACES[p.cat]||[]).push(p);for(const c in PLACES)PLACES[c].sort((a,b)=>a.car_min-b.car_min||a.walk_min-b.walk_min);draw()}).catch(e=>{main.innerHTML=`<p class="lead">${esc(t("load_err",e.message))}</p>`});
</script>
