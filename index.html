<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Eclipse — Золотая миля, Марбелья</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4efe7;--card:#fffdf9;--ink:#1d1a17;--mute:#7b7268;--line:#e2d9cc;--bronze:#9a7650;--on:#1d1a17;--onink:#f4efe7;--soft:#ebe3d6}
body.night{--bg:#14161b;--card:#1d2027;--ink:#f1ebe1;--mute:#9a958c;--line:#2e323b;--bronze:#c9a67c;--on:#f1ebe1;--onink:#14161b;--soft:#232730}
html,body{min-height:100%}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);transition:background .9s,color .9s;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.01em}
.app{max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 8px;transition:background .9s}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-size:15px;letter-spacing:.34em;text-decoration:none;white-space:nowrap}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--mute);white-space:nowrap}
.sp{flex:1}
.lang{display:flex;flex:none}.lang button{font-size:12px;padding:4px;color:var(--mute)}.lang button.on{color:var(--ink);font-weight:600}
.ecl{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);position:relative;overflow:hidden;background:var(--card)}
.ecl i{position:absolute;inset:8px;border-radius:50%;background:var(--bronze)}
.ecl b{position:absolute;inset:8px;border-radius:50%;background:var(--card);transform:translateX(125%);transition:transform .9s cubic-bezier(.6,0,.2,1)}
body.night .ecl b{transform:translateX(26%)}
.crumbs{font-size:12px;color:var(--mute);margin-top:6px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.crumbs a{text-decoration:none}.crumbs span.cur{color:var(--ink);font-weight:600}
main{flex:1;padding:16px 16px 100px}
h1{font-size:34px;line-height:1.08;margin-bottom:8px}
h2{font-size:24px;line-height:1.15;margin-bottom:10px}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);margin:22px 0 9px;font-weight:600}
p.lead{color:var(--mute);margin-bottom:12px;max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;text-decoration:none;text-align:center}
.btn.pri{background:var(--on);color:var(--onink);border-color:var(--on)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;font-weight:500;border-radius:10px}
.btn.on{background:var(--on);color:var(--onink);border-color:var(--on)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}.row.fill>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font-size:22px;font-weight:400}.stat span{font-size:12px;color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips .btn{white-space:nowrap;flex:none}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-align:left;width:100%;text-decoration:none}
.li .t{flex:1}.li .m{font-size:12px;color:var(--mute)}.li b{white-space:nowrap;font-weight:600}
.note{font-size:12px;color:var(--mute);margin-top:10px}
.pic{position:relative;border-radius:16px;overflow:hidden;background:var(--soft)}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .cap{position:absolute;left:12px;bottom:10px;font-size:11px;letter-spacing:.06em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
/* день и ночь: затмение */
.hero{aspect-ratio:4/5;max-height:72vh;width:100%}
.hero img{position:absolute;inset:0}
.hero .nightimg{clip-path:circle(0% at 88% 6%);transition:clip-path 1.4s cubic-bezier(.6,0,.2,1)}
body.night .hero .nightimg{clip-path:circle(160% at 88% 6%)}
.hero .ttl{position:absolute;left:18px;right:18px;bottom:18px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.hero .ttl h1{font-size:44px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.5));pointer-events:none}
.hero .ttl{z-index:2}
/* здание */
.bld{display:flex;flex-direction:column;gap:5px;max-width:640px;margin:0 auto}
.fl{display:flex;align-items:stretch;gap:6px}
.fl>.lab{width:48px;font-size:11px;color:var(--mute);display:flex;align-items:center;text-align:left}
.fl>.us{flex:1;display:flex;gap:4px}
.u{min-height:46px;border-radius:7px;background:var(--soft);border:1px solid var(--line);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:3px;min-width:0}
.u b{font-weight:600}
.u.dim{opacity:.22}.u.sold{background:transparent;border-style:dashed;color:var(--mute)}.u.res{background:color-mix(in srgb,var(--bronze) 28%,var(--soft))}
.u.hit{outline:2px solid var(--bronze);outline-offset:-1px}
.fl.f5 .us{padding:0 9%}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
.plan{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:auto}
.plan img{width:100%;min-width:560px}
/* квартира */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.facts b{display:block;font-size:19px;font-weight:400}.facts span{font-size:11px;color:var(--mute)}
.price{font-size:30px}
.st{font-size:10px;border-radius:20px;padding:3px 10px;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.st.free{border-color:var(--bronze);color:var(--bronze)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:10px;font-size:13px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--bronze);font-weight:600}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.thumbs button{flex:none;width:92px;border-radius:9px;overflow:hidden;border:2px solid transparent;opacity:.75}
.thumbs button.on{border-color:var(--bronze);opacity:1}
.thumbs img{aspect-ratio:16/10;object-fit:cover;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);cursor:pointer;font-weight:600}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
tr.dim td{opacity:.3}
tr.rowlink{cursor:pointer}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.bot a{flex:1;text-align:center;text-decoration:none;font-size:11px;color:var(--mute);padding:6px 2px;border-radius:8px}
nav.bot a b{display:block;font-size:17px;font-weight:400;line-height:1.15}
nav.bot a.on{color:var(--ink);font-weight:600}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{display:flex;align-items:center}
label.f{display:block;font-size:12px;color:var(--mute);margin:14px 0 6px}
input[type=range]{width:100%;accent-color:var(--bronze)}
input[type=text]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 13px;font:inherit;background:var(--bg);color:var(--ink)}
.agent{border:1px dashed var(--bronze)}
.foot{font-size:11px;color:var(--mute);margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
@media(min-width:900px){
  main{padding:26px 26px 50px}
  nav.bot{position:static;border:0;background:none;backdrop-filter:none;padding:0;gap:2px}
  nav.bot a{flex:none;padding:6px 11px;font-size:13px}nav.bot a b{display:none}
  .two{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
  .veil{align-items:center}.sheet{border-radius:18px}
  h1{font-size:44px}.hero{aspect-ratio:16/9;max-height:none}.hero .ttl h1{font-size:64px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="hrow">
    <a class="logo serif" href="#/">ECLIPSE</a>
    <span class="tag">концепт</span>
    <span class="sp"></span>
    <nav class="bot" id="nav"></nav>
    <span class="lang" title="EN и ES появятся позже"><button disabled>EN</button><button disabled>ES</button><button class="on">RU</button></span>
    <button class="ecl" id="ecl" title="День и ночь" aria-label="День и ночь"><i></i><b></b></button>
  </div>
  <div class="crumbs" id="crumbs"></div>
</header>
<main id="main"><p class="lead">Загрузка…</p></main>
</div>
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>

<script>
/* Eclipse: витрина-концепт. Дом выдуман, место настоящее. Данные: data/*.json из этапов 2 и 3. */
let UNITS=[],DOM={},PLACES={};
const STN={free:"Свободна",res:"Бронь",sold:"Продана"};
const FLN=f=>f==5?"Пентхаус":f+" этаж";
const TYPE_SHORT={T2:"2 спальни",T3:"3 спальни",T4:"4 спальни",G:"С садом",G2:"С садом",PH:"Пентхаус"};
const SHOTS=[["gostinaya","Гостиная"],["kuhnya","Кухня"],["spalnya1","Спальня 1"],["spalnya2","Спальня 2"],["vannaya","Ванная"]];
const VIEWS={"Утро":"terrasa-utro","Закат":"terrasa-zakat","Ночь":"terrasa-noch"};
const CATS=["Рядом","Пляж","Рестораны","Магазины","Школы","Здоровье","Спорт","Дорога"];
function load(k){try{return JSON.parse(localStorage[k]||"[]")}catch(e){return[]}}
const S={beds:0,max:0,sea:false,free:false,fav:load("eclFav2"),cmp:load("eclCmp2"),cat:"Рядом",walk:true,sort:"id",dir:1,tab:"Планировка",shot:0,time:"Закат"};
const $=s=>document.querySelector(s),main=$("#main");
const eur=n=>new Intl.NumberFormat("ru-RU").format(Math.round(n))+" €";
const num=n=>String(n).replace(".",",");
const U=id=>UNITS.find(u=>u.id==id);
const night=()=>document.body.classList.contains("night");
const pass=u=>(!S.beds||u.bed>=S.beds)&&(!S.max||u.price<=S.max)&&(!S.sea||u.floor>=3)&&(!S.free||u.status=="free");
const active=()=>S.beds||S.max||S.sea||S.free;
const agent=()=>{const m=location.hash.match(/[?&]agent=([^&]+)/);return m?decodeURIComponent(m[1]):null};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const q=()=>agent()?"?agent="+encodeURIComponent(agent()):"";
const save=()=>{try{localStorage.eclFav2=JSON.stringify(S.fav);localStorage.eclCmp2=JSON.stringify(S.cmp)}catch(e){}};
function go(h){location.hash=h+(h.includes("?")?"":q())}
function nav(cur){const it=[["#/area","◎","Район"],["#/building","▦","Дом"],["#/list","≡","Список"],["#/fav","♡","Избранное"+(S.fav.length?" "+S.fav.length:"")],["#/more","⋯","Ещё"]];
  $("#nav").innerHTML=it.map(([h,i,t])=>`<a href="${h+q()}" class="${cur==h?"on":""}"><b>${i}</b>${t}</a>`).join("")}
function crumbs(a){$("#crumbs").innerHTML=a.map(([t,h],i)=>i==a.length-1?`<span class="cur">${t}</span>`:`<a href="${h+q()}">${t}</a>`).join(" › ")}
const fbar=()=>`<div class="row" style="margin:10px 0;align-items:center"><button class="btn sm ${active()?"on":""}" onclick="filter()">Фильтр${active()?" ✓":""}</button><span style="font-size:13px;color:var(--mute)">подходит ${UNITS.filter(pass).length} из ${UNITS.length}</span></div>`;
const cell=u=>`<button class="u ${u.status=="sold"?"sold":u.status=="res"?"res":""} ${active()?(pass(u)?"hit":"dim"):""}" style="flex:${DOM.types[u.type].W}" onclick="go('#/unit/${u.id}')"><b>${u.id}</b></button>`;
const foot=`<p class="foot">Eclipse — концепт. Дом выдуман, место настоящее. Цены, сроки и статусы условные. Изображения созданы с помощью AI по чертежам и рельефу. Данные: Catastro, IGN España (CC BY 4.0), © участники OpenStreetMap.</p>`;

const R={
"":()=>{crumbs([["Золотая миля, Марбелья"]]);nav("");const pl=PLACES["Пляж"]?Math.min(...PLACES["Пляж"].map(p=>p.walk_min)):"";
  main.innerHTML=`<div class="two"><div><div class="pic hero"><img src="img/fasad-den.jpg" alt="Eclipse днём"><img class="nightimg" src="img/fasad-noch.jpg" alt="Eclipse ночью"><div class="ttl"><h1 class="serif">Eclipse</h1><div>Золотая миля · Марбелья</div></div></div>
  <p class="note">Нажмите на диск справа вверху: день сменится ночью.</p></div><div>
  <h2 class="serif" style="margin-top:14px">Двадцать две резиденции над бульваром Золотой мили</h2>
  <p class="lead">Четыре этажа и пентхаус на южном склоне. Каждая терраса смотрит на море, каждая спальня с северной стороны смотрит на Ла-Кончу.</p>
  <div class="grid3"><div class="card stat"><b class="serif">${UNITS.length}</b><span>квартиры</span></div><div class="card stat"><b class="serif">4 + 1</b><span>этажа и пентхаус</span></div><div class="card stat"><b class="serif">${pl} мин</b><span>пешком до пляжа</span></div></div>
  <div class="row fill" style="margin-top:14px"><button class="btn pri" onclick="go('#/building')">Выбрать квартиру</button></div>
  <div class="row fill" style="margin-top:8px"><button class="btn" onclick="go('#/area')">Район</button><button class="btn" onclick="go('#/unit/3C')">Пример: 3C</button></div>
  </div></div>${foot}`},
"area":()=>{crumbs([["Район"]]);nav("#/area");const L=PLACES[S.cat]||[];
  main.innerHTML=`<h2 class="serif">Золотая миля</h2><p class="lead">Склон над бульваром, напротив Puente Romano. Минуты посчитаны по дорожной сети от участка; на машине без пробок.</p>
  <div class="two"><div><div class="pic" style="aspect-ratio:1/1"><img src="img/aerofoto.jpg" alt="Аэрофотоснимок участка"><div class="cap">Участок и бульвар · снимок PNOA, IGN España</div></div></div><div>
  <div class="chips" style="margin-top:12px">${CATS.filter(c=>PLACES[c]).map(c=>`<button class="btn sm ${c==S.cat?"on":""}" onclick="S.cat='${c}';draw()">${c}</button>`).join("")}</div>
  <div class="row" style="margin:10px 0"><button class="btn sm ${S.walk?"on":""}" onclick="S.walk=true;draw()">Пешком</button><button class="btn sm ${!S.walk?"on":""}" onclick="S.walk=false;draw()">На машине</button></div>
  <div class="list">${L.map(p=>`<a class="li" href="${p.site||p.osm}" target="_blank" rel="noopener"><span class="t">${esc(p.name)}<div class="m">${S.walk?(p.walk_min<=40?p.walk_m+" м":"дальше 40 минут"):num(p.car_km)+" км"}</div></span><b>${S.walk?(p.walk_min<=40?p.walk_min+" мин":"—"):p.car_min+" мин"}</b></a>`).join("")}</div>
  <p class="note">Нажатие на место открывает его сайт или запись на карте OpenStreetMap.</p>
  <div class="row fill" style="margin-top:14px"><button class="btn pri" onclick="go('#/building')">Смотреть дом</button></div></div></div>${foot}`},
"building":()=>{crumbs([["Район","#/area"],["Дом"]]);nav("#/building");
  main.innerHTML=`<div class="two"><div><div class="pic" style="aspect-ratio:16/10"><img src="img/${night()?"fasad-noch":"fasad-den"}-s.jpg" alt="Фасад"></div>
  <h3>Генплан</h3><div class="plan"><object data="plans/genplan.svg" type="image/svg+xml" style="width:100%;min-width:560px;display:block"></object></div></div><div>
  <h2 class="serif" style="margin-top:14px">Выберите этаж или квартиру</h2>${fbar()}
  <div class="card"><div class="bld">${[5,4,3,2,1].map(f=>`<div class="fl f${f}"><button class="lab" onclick="go('#/floor/${f}')">${f==5?"ПХ":f+" эт"} ›</button><div class="us">${UNITS.filter(u=>u.floor==f).map(cell).join("")}</div></div>`).join("")}</div>
  <div class="legend"><span><i style="background:var(--soft)"></i>свободна</span><span><i style="background:color-mix(in srgb,var(--bronze) 28%,var(--soft))"></i>бронь</span><span><i style="border-style:dashed"></i>продана</span></div></div>
  <div class="row fill" style="margin-top:12px"><button class="btn" onclick="go('#/list')">Показать списком</button></div>
  <p class="note">Слева запад, справа восток. Все террасы смотрят на юг, к морю.</p></div></div>${foot}`},
"floor":f=>{f=+f||1;crumbs([["Район","#/area"],["Дом","#/building"],[FLN(f)]]);nav("#/building");const us=UNITS.filter(u=>u.floor==f);
  main.innerHTML=`<h2 class="serif">${FLN(f)}</h2><div class="chips">${[1,2,3,4,5].map(x=>`<button class="btn sm ${x==f?"on":""}" onclick="go('#/floor/${x}')">${x==5?"Пентхаус":x}</button>`).join("")}</div>${fbar()}
  <div class="plan"><img src="plans/etazh-${f}.svg" alt="План этажа"></div>
  <h3>Квартиры этажа</h3><div class="list">${us.map(u=>`<button class="li" style="${active()&&!pass(u)?"opacity:.35":""}" onclick="go('#/unit/${u.id}')"><span class="t"><b>${u.id}</b> · ${u.type_name}<div class="m">${num(u.area)} м² · терраса ${num(u.terrace)} м² · ${u.side.toLowerCase()} · ${STN[u.status].toLowerCase()}</div></span><b>${eur(u.price)}</b></button>`).join("")}</div>
  <p class="note">Отметка пола ${num(us[0].level)} м над морем. Вид с этажа: ${us[0].view.toLowerCase()}.</p>${foot}`},
"unit":id=>{const u=U(id);if(!u)return go("#/building");const a=agent(),T=DOM.types[u.type];crumbs([["Район","#/area"],["Дом","#/building"],[FLN(u.floor),"#/floor/"+u.floor],["Квартира "+u.id]]);nav("#/building");
  const fav=S.fav.includes(u.id),cmp=S.cmp.includes(u.id),walkOk=u.type=="T2",sh=SHOTS[S.shot];
  const tabs={"Планировка":`<div class="plan"><img src="plans/planirovka-${u.type}.svg" alt="Планировка" style="min-width:480px"></div>`,
   "Комнаты":`<table>${T.rooms.map(r=>`<tr><td>${r.name}</td><td>${num(r.w)} × ${num(r.h)} м</td><td>${num(r.m2)} м²</td></tr>`).join("")}</table>`,
   "Платежи":`<table><tr><td>Бронь</td><td>20 000 €</td></tr><tr><td>Договор, 30%</td><td>${eur(u.price*.3)}</td></tr><tr><td>В ходе стройки, 20%</td><td>${eur(u.price*.2)}</td></tr><tr><td>При сдаче, 50%</td><td>${eur(u.price*.5)}</td></tr></table>`,
   "Расходы":`<table><tr><td>Платежи комплекса</td><td>${eur(u.fee_month)} в месяц</td></tr><tr><td>Налог на недвижимость</td><td>${eur(u.price*.0006)} в месяц</td></tr></table>`,
   "В цену входит":`<div class="list"><div class="li">Кухня с техникой</div><div class="li">Два места в паркинге</div><div class="li">Кладовая</div></div>`};
  if(!tabs[S.tab])S.tab="Планировка";
  main.innerHTML=`<div class="two"><div><div class="pic" style="aspect-ratio:16/10"><img src="img/${sh[0]}.jpg" alt="${sh[1]}"><div class="cap">${sh[1]}${u.id=="3C"?"":" · показана квартира 3C"}</div></div>
  <div class="thumbs">${SHOTS.map((s,i)=>`<button class="${i==S.shot?"on":""}" onclick="S.shot=${i};draw()" aria-label="${s[1]}"><img src="img/${s[0]}-s.jpg" alt=""></button>`).join("")}</div>
  ${u.type=="T2"?"":`<p class="note">Интерьеры сняты в квартире 3C (2 спальни). Для этой планировки кадры ещё не сделаны: стиль и материалы те же.</p>`}</div>
  <div><div class="row" style="align-items:center;margin-top:14px"><h1 class="serif" style="margin:0">Квартира ${u.id}</h1><span class="st ${u.status}">${STN[u.status]}</span></div>
  <p class="lead" style="margin-top:6px">${u.type_name}${u.floor==5?"":" · "+FLN(u.floor)} · ${u.side} · ${u.view}</p>
  <div class="facts"><div><b class="serif">${u.bed}</b><span>спальни</span></div><div><b class="serif">${u.bath}</b><span>ванные</span></div><div><b class="serif">${num(u.area)}</b><span>м²</span></div><div><b class="serif">${num(u.terrace)}</b><span>м² терраса</span></div></div>
  ${u.garden?`<p class="note" style="margin:0 0 8px">Собственный сад ${Math.round(u.garden)} м² с бассейном.</p>`:""}
  <div class="price serif">${eur(u.price)}</div>
  <div class="row fill" style="margin-top:12px">${walkOk?`<a class="btn pri" href="proba/index.html">Войти в квартиру</a>`:`<button class="btn pri" disabled>Прогулка скоро</button>`}<button class="btn" onclick="go('#/terrace/${u.id}')">Вид с террасы</button></div>
  ${walkOk?(u.id=="3C"?"":`<p class="note">Прогулка открывает квартиру 3C: та же планировка «2 спальни».</p>`):`<p class="note">Прогулка в 3D пока сделана для планировки «2 спальни». Откройте 3C, чтобы пройтись.</p>`}
  <div class="row" style="margin-top:10px"><button class="btn sm ${fav?"on":""}" onclick="tog('fav','${u.id}')">${fav?"♥ В избранном":"♡ В избранное"}</button><button class="btn sm ${cmp?"on":""}" onclick="tog('cmp','${u.id}')">${cmp?"✓ В сравнении":"Сравнить"}</button><button class="btn sm" onclick="share('${u.id}')">Поделиться</button></div>
  <div class="card ${a?"agent":""}" style="margin-top:14px"><div style="font-size:12px;color:var(--mute)">${a?"Ваш агент":"Отдел продаж Eclipse"}</div><b>${a?esc(a):"Контакт появится здесь"}</b>
  <div class="row fill" style="margin-top:8px"><button class="btn sm" onclick="go('#/contact/${u.id}')">Записаться на показ</button></div></div>
  <div class="tabs">${Object.keys(tabs).map(t=>`<button class="${t==S.tab?"on":""}" onclick="S.tab='${t}';draw(true)">${t}</button>`).join("")}</div>${tabs[S.tab]}</div></div>${foot}`},
"terrace":id=>{const u=U(id);if(!u)return go("#/building");crumbs([["Дом","#/building"],["Квартира "+u.id,"#/unit/"+u.id],["Терраса"]]);nav("#/building");
  main.innerHTML=`<div class="pic" style="aspect-ratio:16/9;max-height:74vh"><img src="img/${VIEWS[S.time]}.jpg" alt="Вид с террасы, ${S.time.toLowerCase()}"><div class="cap">Вид на юг, к морю · ${S.time.toLowerCase()}</div></div>
  <div class="row" style="margin-top:12px;align-items:center">${Object.keys(VIEWS).map(t=>`<button class="btn sm ${t==S.time?"on":""}" onclick="setTime('${t}')">${t}</button>`).join("")}</div>
  <p class="lead" style="margin-top:12px">${FLN(u.floor)} · высота глаз ${num(u.eye)} м над морем · ${u.side.toLowerCase()}</p>
  ${u.floor==3?`<p class="note">Линия горизонта, ширина моря и положение зданий взяты с настоящего рельефа и кадастра для высоты третьего этажа.</p>`:`<p class="note">Показан вид с третьего этажа. Для ${u.floor==5?"пентхауса":u.floor+"-го этажа"} он ещё не снят: ${u.floor>3?"с этой высоты моря видно больше.":"с этой высоты часть моря закрывают сосны."}</p>`}
  <div class="row fill" style="margin-top:14px"><button class="btn" onclick="go('#/unit/${u.id}')">Назад к квартире</button><button class="btn pri" onclick="go('#/contact/${u.id}')">Записаться на показ</button></div>${foot}`},
"list":()=>{crumbs([["Дом","#/building"],["Список"]]);nav("#/list");const cols=[["id","№"],["floor","Этаж"],["bed","Спальни"],["area","м²"],["terrace","Терраса"],["view","Вид"],["price","Цена"],["status","Статус"]];
  const rows=[...UNITS].sort((a,b)=>(a[S.sort]>b[S.sort]?1:a[S.sort]<b[S.sort]?-1:0)*S.dir);
  main.innerHTML=`<h2 class="serif">Все квартиры</h2>${fbar()}<div class="scroll"><table><tr>${cols.map(([c,n])=>`<th onclick="S.dir=S.sort=='${c}'?-S.dir:1;S.sort='${c}';draw(true)">${n}${S.sort==c?(S.dir>0?" ↑":" ↓"):""}</th>`).join("")}</tr>
  ${rows.map(u=>`<tr class="rowlink ${active()&&!pass(u)?"dim":""}" onclick="go('#/unit/${u.id}')"><td><b>${u.id}</b></td><td>${u.floor==5?"ПХ":u.floor}</td><td>${u.bed}</td><td>${num(u.area)}</td><td>${num(u.terrace)}</td><td>${u.view}</td><td>${eur(u.price)}</td><td>${STN[u.status]}</td></tr>`).join("")}</table></div>
  <p class="note">Нажмите на заголовок столбца, чтобы отсортировать. Нажмите на строку, чтобы открыть квартиру.</p>${foot}`},
"fav":()=>{crumbs([["Избранное"]]);nav("#/fav");const f=S.fav.map(U).filter(Boolean),c=S.cmp.map(U).filter(Boolean);
  main.innerHTML=`<h2 class="serif">Избранное</h2>${f.length?`<div class="list">${f.map(u=>`<button class="li" onclick="go('#/unit/${u.id}')"><span class="t"><b>${u.id}</b> · ${u.type_name}<div class="m">${FLN(u.floor)} · ${u.view}</div></span><b>${eur(u.price)}</b></button>`).join("")}</div>`:`<p class="lead">Пока пусто. Откройте квартиру и нажмите «В избранное».</p>`}
  <h3>Сравнение</h3>${c.length?`<div class="scroll"><table><tr><th></th>${c.map(u=>`<th>${u.id}</th>`).join("")}</tr>${[["Этаж",u=>FLN(u.floor)],["Спальни",u=>u.bed],["Площадь",u=>num(u.area)+" м²"],["Терраса",u=>num(u.terrace)+" м²"],["Вид",u=>u.view],["Цена",u=>eur(u.price)],["В месяц",u=>eur(u.fee_month)],["Статус",u=>STN[u.status]]].map(([n,fn])=>`<tr><td>${n}</td>${c.map(u=>`<td>${fn(u)}</td>`).join("")}</tr>`).join("")}</table></div>`:`<p class="lead">Добавьте до трёх квартир кнопкой «Сравнить».</p>`}
  <div class="row fill" style="margin-top:14px"><button class="btn pri" onclick="go('#/building')">Выбрать квартиру</button></div>${foot}`},
"more":()=>{crumbs([["Ещё"]]);nav("#/more");main.innerHTML=`<h2 class="serif">Ещё</h2><div class="list"><button class="li" onclick="go('#/contact')"><span class="t">Связаться</span></button><button class="li" onclick="go('#/dev')"><span class="t">Для девелопера<div class="m">Карта спроса, ссылка агента</div></span></button><a class="li" href="plans/razrez.svg" target="_blank"><span class="t">Разрез дома по склону</span></a><a class="li" href="proba/index.html"><span class="t">Прогулка по квартире 3C<div class="m">Серая проба в 3D</div></span></a></div>${foot}`},
"dev":()=>{crumbs([["Ещё","#/more"],["Для девелопера"]]);nav("#/more");const V=u=>20+((u.floor*37+u.x0*13+u.area*3)%97|0)+(u.floor==5?60:0),mx=Math.max(...UNITS.map(V));
  main.innerHTML=`<h2 class="serif">Для девелопера</h2><p class="lead">Что вы видите, пока покупатели смотрят дом. Цифры на этом экране демонстрационные.</p>
  <h3>Карта спроса: просмотры за 30 дней</h3><div class="card"><div class="bld">${[5,4,3,2,1].map(f=>`<div class="fl f${f}"><span class="lab">${f==5?"ПХ":f+" эт"}</span><div class="us">${UNITS.filter(u=>u.floor==f).map(u=>`<button class="u" style="flex:${DOM.types[u.type].W};background:color-mix(in srgb,var(--bronze) ${Math.round(8+82*V(u)/mx)}%,var(--card))" onclick="go('#/unit/${u.id}')"><b>${u.id}</b><span>${V(u)}</span></button>`).join("")}</div></div>`).join("")}</div></div>
  <h3>Самые просматриваемые</h3><div class="scroll"><table><tr><th>№</th><th>Просмотры</th><th>В избранном</th><th>Сравнения</th><th>Ссылки</th></tr>${[...UNITS].sort((a,b)=>V(b)-V(a)).slice(0,6).map(u=>`<tr><td><b>${u.id}</b></td><td>${V(u)}</td><td>${Math.round(V(u)/6)}</td><td>${Math.round(V(u)/9)}</td><td>${Math.round(V(u)/14)}</td></tr>`).join("")}</table></div>
  <h3>Ссылка агента</h3><div class="card"><label class="f" style="margin-top:0">Имя и телефон агента</label><input type="text" id="ag" placeholder="Например: Анна, +34 600 000 000"><div class="row fill" style="margin-top:8px"><button class="btn" onclick="const v=$('#ag').value.trim();if(v)location.hash='#/unit/3C?agent='+encodeURIComponent(v)">Открыть квартиру 3C с контактами агента</button></div><p class="note">Покупатель по такой ссылке видит контакты агента, а не отдела продаж.</p></div>${foot}`},
"contact":id=>{crumbs([["Связаться"]]);nav("#/more");const a=agent();main.innerHTML=`<h2 class="serif">Связаться</h2>${id&&U(id)?`<p class="lead">Квартира ${id} уже указана в заявке.</p>`:""}<div class="card ${a?"agent":""}"><div style="font-size:12px;color:var(--mute)">${a?"Ваш агент":"Отдел продаж Eclipse"}</div><b>${a?esc(a):"Контакт появится здесь"}</b></div>
  <h3>Запись на показ</h3><label class="f">Имя</label><input type="text"><label class="f">Телефон или почта</label><input type="text"><label class="f">Удобное время</label><input type="text">
  <div class="row fill" style="margin-top:14px"><button class="btn pri" onclick="msg('Это концепт: заявка никуда не отправляется.')">Отправить</button></div>${foot}`}
};
function tog(k,id){const a=S[k],i=a.indexOf(id);if(i>=0)a.splice(i,1);else{if(k=="cmp"&&a.length>=3)return msg("В сравнении не больше трёх квартир.");a.push(id)}save();draw(true)}
function share(id){const url=location.href.split("#")[0]+"#/unit/"+id+q();(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>msg("Ссылка на квартиру "+id+" скопирована."),()=>msg(url))}
function setNight(n){document.body.classList.toggle("night",n)}
function setTime(t){S.time=t;setNight(t=="Ночь");draw(true)}
function sheet(h){$("#sheet").innerHTML=h;$("#veil").classList.add("on")}
function closeSheet(){$("#veil").classList.remove("on")}
function msg(t){sheet(`<h2 class="serif">Eclipse<span class="sp"></span><button class="btn sm" onclick="closeSheet()">✕</button></h2><p class="lead" style="word-break:break-word">${esc(t)}</p>`)}
function filter(){sheet(`<h2 class="serif">Фильтр<span class="sp"></span><button class="btn sm" onclick="closeSheet()">✕</button></h2>
  <label class="f">Спальни, не меньше</label><div class="row">${[0,2,3,4].map(n=>`<button class="btn sm ${S.beds==n?"on":""}" onclick="S.beds=${n};filter();draw(true)">${n||"Любые"}</button>`).join("")}</div>
  <label class="f">Бюджет до: <b>${S.max?eur(S.max):"не важно"}</b></label><input type="range" min="0" max="8000000" step="250000" value="${S.max}" oninput="S.max=+this.value;this.previousElementSibling.querySelector('b').textContent=S.max?eur(S.max):'не важно';draw(true);cnt()">
  <label class="f">Дополнительно</label><div class="row"><button class="btn sm ${S.sea?"on":""}" onclick="S.sea=!S.sea;filter();draw(true)">Открытый вид на море</button><button class="btn sm ${S.free?"on":""}" onclick="S.free=!S.free;filter();draw(true)">Только свободные</button></div>
  <div class="row fill" style="margin-top:18px"><button class="btn" onclick="S.beds=0;S.max=0;S.sea=S.free=false;filter();draw(true)">Сбросить</button><button class="btn pri" id="cnt" onclick="closeSheet()">Показать ${UNITS.filter(pass).length}</button></div>`)}
function cnt(){const b=$("#cnt");if(b)b.textContent="Показать "+UNITS.filter(pass).length}
function draw(keep){const y=scrollY,h=location.hash.replace(/^#\/?/,"").split("?")[0].split("/");(R[h[0]]||R[""])(h[1]);if(keep)scrollTo(0,y)}
$("#ecl").onclick=()=>{const n=!night();setNight(n);S.time=n?"Ночь":"Закат";const h=location.hash;if(/terrace|building/.test(h))draw(true)};
$("#veil").onclick=e=>{if(e.target.id=="veil")closeSheet()};
addEventListener("hashchange",()=>{closeSheet();S.shot=0;draw();scrollTo(0,0)});
Promise.all(["data/kvartiry.json","data/dom.json","data/mesta.json"].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+" "+r.status);return r.json()}))).then(([u,d,m])=>{UNITS=u;DOM=d;for(const p of m)(PLACES[p.cat]=PLACES[p.cat]||[]).push(p);for(const c in PLACES)PLACES[c].sort((a,b)=>a.car_min-b.car_min||a.walk_min-b.walk_min);draw()}).catch(e=>{main.innerHTML=`<p class="lead">Данные не загрузились: ${esc(e.message)}. Сайт нужно открывать через сервер, а не двойным щелчком по файлу.</p>`});
</script>
