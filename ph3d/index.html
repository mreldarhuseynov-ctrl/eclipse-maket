/* ---------- параметры квартиры 3C (тип T2), из 03-dom/dannye ---------- */

/* квартира: x вдоль фасада, y к северу. Сцена: X = x, Z = -y, юг (море) = +Z */
const P = (x, y, h = 0) => new THREE.Vector3(x, h, -y);

const mobile = matchMedia('(pointer:coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(mobile && innerHeight > innerWidth ? 78 : 68, innerWidth / innerHeight, 0.05, 30000);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------- материалы ---------- */
const M = (c, r = .8, m = 0, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m, ...o });
const mat = { wall: M(0xf3efe8, .92), ceil: M(0xfaf8f4, .95), floor: M(0xd8d0c2, .55), deck: M(0xcfc6b6, .7), oak: M(0xb58a5c, .6), stone: M(0xe6e1d8, .35),
  dark: M(0x2f2c29, .6), fabric: M(0xcbc3b6, .95), fabric2: M(0x9c9486, .95), bronze: M(0x8a6a4a, .35, .8), white: M(0xffffff, .5), frame: M(0x3a3632, .5, .4),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: .05, metalness: 0, transmission: .92, transparent: true, opacity: .28, thickness: .02 }),
  green: M(0x5f7a4a, .9), bed: M(0xf4f1ec, .95) };
const apt = new THREE.Group(); scene.add(apt);
const colliders = [], doors = [];
function box(w, h, d, m, x, y, z, parent = apt, shadow = true) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = shadow; o.receiveShadow = true; parent.add(o); return o;
}
/* брусок в координатах квартиры: от (x1,y1) до (x2,y2), по высоте от h0 до h1 */
function slab(x1, y1, x2, y2, h0, h1, m, collide = false) {
  const o = box(Math.abs(x2 - x1), h1 - h0, Math.abs(y2 - y1), m, (x1 + x2) / 2, (h0 + h1) / 2, -(y1 + y2) / 2);
  if (collide) colliders.push({ minX: Math.min(x1, x2), maxX: Math.max(x1, x2), minZ: -Math.max(y1, y2), maxZ: -Math.min(y1, y2) });
  return o;
}
/* стена вдоль оси с проёмами: {a,b,kind,h0,h1}; a,b — метры от начала стены */
function wall(x1, y1, x2, y2, ops = [], m = mat.wall) {
  const horiz = Math.abs(y2 - y1) < 1e-6, L = horiz ? x2 - x1 : y2 - y1; let p = 0;
  const seg = (a, b, h0, h1, mm = m, col = true) => { if (b - a < 1e-3 || h1 - h0 < 1e-3) return;
    horiz ? slab(x1 + a, y1 - T / 2, x1 + b, y1 + T / 2, h0, h1, mm, col && h0 < 1.9) : slab(x1 - T / 2, y1 + a, x1 + T / 2, y1 + b, h0, h1, mm, col && h0 < 1.9); };
  for (const o of [...ops].sort((u, v) => u.a - v.a)) {
    seg(p, o.a, 0, H); const h0 = o.h0 ?? 0, h1 = o.h1 ?? 2.3;
    seg(o.a, o.b, 0, h0); seg(o.a, o.b, h1, H);
    const at = t => horiz ? [x1 + t, y1] : [x1, y1 + t];
    if (o.kind === 'glass') { seg(o.a, o.b, h0, h1, mat.glass, true); frame(at(o.a), at(o.b), h0, h1, horiz); }
    if (o.kind === 'door') addDoor(at(o.a), at(o.b), horiz, o);
    if (o.kind === 'slide') addSlide(at(o.a), at(o.b), horiz, o);

function frame(A, B, h0, h1, horiz) {
  const f = 0.045, len = Math.hypot(B[0] - A[0], B[1] - A[1]), cx = (A[0] + B[0]) / 2, cy = (A[1] + B[1]) / 2;

}
function addDoor(A, B, horiz, o) {
  const w = Math.hypot(B[0] - A[0], B[1] - A[1]), h = o.h1 ?? 2.3, hinge = o.hingeEnd ? B : A, sign = o.hingeEnd ? -1 : 1;
  const g = new THREE.Group(); g.position.copy(P(hinge[0], hinge[1])); apt.add(g);
  const leaf = new THREE.Mesh(new THREE.BoxGeometry(horiz ? w : 0.045, h, horiz ? 0.045 : w), o.mat || mat.oak);
  leaf.position.set(horiz ? sign * w / 2 : 0, h / 2, horiz ? 0 : -sign * w / 2); leaf.castShadow = leaf.receiveShadow = true; g.add(leaf);
  const hd = new THREE.Mesh(new THREE.BoxGeometry(horiz ? .12 : .09, .025, horiz ? .09 : .12), mat.bronze);

    mid: P((A[0] + B[0]) / 2, (A[1] + B[1]) / 2, 1.1) };

}
function addSlide(A, B, horiz, o) {            /* раздвижная стеклянная дверь: левая половина неподвижна, правая уезжает за неё */
  const w = (B[0] - A[0]) / 2, h = o.h1 ?? 2.6;
  const pane = (x, z) => { const g = new THREE.Group(); g.position.copy(P(x, A[1])); g.position.z += z; apt.add(g);
    const gl = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.02), mat.glass); gl.position.y = h / 2; g.add(gl);
    for (const s of [-1, 1]) { const f = new THREE.Mesh(new THREE.BoxGeometry(0.04, h, 0.04), mat.frame); f.position.set(s * (w / 2 - .02), h / 2, 0); g.add(f); }
    for (const yy of [0.02, h - 0.02]) { const f = new THREE.Mesh(new THREE.BoxGeometry(w, 0.04, 0.04), mat.frame); f.position.y = yy; g.add(f); }

  const d = { type: 'slide', g: mov.g, x0: mov.g.position.x, w, open: 0, target: 0, name: o.name || 'Дверь на террасу',
    c: { minX: A[0] + w, maxX: B[0], minZ: -A[1] - T / 2, maxZ: -A[1] + T / 2 }, mid: P(A[0] + w * 1.5, A[1], 1.1) };
  d.c.active = () => d.open < 0.75; colliders.push(d.c); doors.push(d); mov.gl.userData.door = d;
}

/* ---------- коробка пентхауса PH1 ---------- */

slab(27.2, 6.5, 30, 12.5, 0, H, mat.dark, true);                 // второй узел

  { a: 18.8, b: 22.0, kind: 'glass', h0: 0, h1: 2.7 }, { a: 22.8, b: 25.8, kind: 'glass', h0: 0, h1: 2.7 }, { a: 26.6, b: 29.6, kind: 'glass', h0: 0, h1: 2.7 }]);
wall(0, 0, 0, 12.5, [{ a: .5, b: 4.6, kind: 'glass', h0: 0, h1: 2.7 }, { a: 7.3, b: 11.7, kind: 'glass', h0: .95, h1: 2.5 }]);
wall(0, 12.5, 9.2, 12.5, [{ a: .8, b: 4.6, kind: 'glass', h0: 0, h1: 2.7 }, { a: 7.4, b: 8.8, kind: 'glass', h0: .6, h1: 2.5 }]);
wall(14.8, 12.5, 27.2, 12.5, [{ a: 3.8, b: 5.4, kind: 'glass', h0: 1.1, h1: 2.4 }, { a: 6.8, b: 7.8, kind: 'glass', h0: 1.3, h1: 2.3 }, { a: 8.9, b: 9.9, kind: 'glass', h0: 1.3, h1: 2.3 }, { a: 10.9, b: 11.9, kind: 'glass', h0: 1.3, h1: 2.3 }]);
wall(30, 0, 30, 6.5);
// внутренние стены. Гостиная, столовая, галерея и кухня — одно открытое пространство
wall(0, 5.1, 30, 5.1, [{ a: .0, b: 12.6, h1: 2.9 }, { a: 15.0, b: 15.95, kind: 'door', name: 'Спальня 1', swing: -1 }, { a: 19.6, b: 20.5, kind: 'door', name: 'Спальня 2', swing: -1 },
  { a: 23.6, b: 24.5, kind: 'door', name: 'Спальня 3', swing: -1 }, { a: 27.4, b: 28.3, kind: 'door', name: 'Спальня 4', swing: -1 }]);
wall(0, 6.5, 27.2, 6.5, [{ a: .0, b: 5.0, h1: 2.9 }, { a: 5.75, b: 6.6, kind: 'door', name: 'Кладовая', swing: 1, mat: mat.white }, { a: 7.6, b: 8.5, kind: 'door', name: 'Кабинет', swing: 1 },
  { a: 10.2, b: 13.8, h1: 2.6 }, { a: 15.8, b: 16.7, kind: 'door', name: 'Гардероб', swing: 1 }, { a: 18.9, b: 19.8, kind: 'door', name: 'Ванная 1', swing: 1, mat: mat.white },
  { a: 21.6, b: 22.5, kind: 'door', name: 'Ванная 2', swing: 1, mat: mat.white }, { a: 23.7, b: 24.6, kind: 'door', name: 'Ванная 3', swing: 1, mat: mat.white }, { a: 25.7, b: 26.6, kind: 'door', name: 'Ванная 4', swing: 1, mat: mat.white }]);
for (const x of [13, 18.4, 22.4, 26.2]) wall(x, 0, x, 5.1);
for (const x of [5.4, 7, 9.2, 14.8, 17.8, 21, 23.2, 25.2, 27.2]) wall(x, 6.5, x, x === 9.2 || x === 14.8 ? 8.0 : 12.5);
wall(9.2, 8.0, 14.8, 8.0, [], mat.dark);
box(1.1, 2.2, 0.03, mat.bronze, 12.0, 1.1, -7.95, apt, false);   // двери лифта
// терраса: стеклянное ограждение по краю, перегородка к соседнему пентхаусу, бассейн, зелень

for (const x of [0.6, 9.0, 17.5]) box(.8, .7, .8, mGreenP, x, .75, 5.4, apt);
// остальной дом под пентхаусом и соседний пентхаус

slab(0, -2.5, 60, 12.5, 30.8 - UNIT.level, -0.3, body);
for (let f = 1; f <= 4; f++) slab(0, -6, 60, -2.5, 30.8 + (f - 1) * 3.3 - UNIT.level - .3, 30.8 + (f - 1) * 3.3 - UNIT.level, mat.ceil);
slab(30, 0, 60, 12.5, 0, H + 0.35, body); slab(30, -6, 60, 0, -0.3, 0, mat.deck);

const mapEl = document.getElementById('map'), k = 6;

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.fov = mobile && innerHeight > innerWidth ? 78 : 68; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
/* ссылка на точку: #x,y,поворот,наклон,время — например #2.6,3,180,0,morning */

{ const lg = sp.get('lang'); if (lg) document.getElementById('back').href = '../index.html?lang=' + lg + '#/unit/PH1'; }
