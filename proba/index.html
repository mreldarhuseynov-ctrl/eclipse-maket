F(.6, -2.9, 1.3, -1.0, 0, .32, mat.fabric); F(1.6, -2.9, 2.3, -1.0, 0, .32, mat.fabric); F(5.6, -2.6, 7.2, -1.6, .7, .74, mat.oak); F(8.2, -3.3, 8.8, -2.7, 0, .5, mat.dark); box(.5, .7, .5, mat.green, 8.5, .85, 3.0, apt);

/* ---------- свет и время суток ---------- */
const sky = new Sky(); sky.scale.setScalar(20000); scene.add(sky);
const sun = new THREE.DirectionalLight(0xffffff, 3); sun.castShadow = true; sun.shadow.mapSize.set(mobile ? 1024 : 2048, mobile ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -14, near: 1, far: 80 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;

function bearing(b, el) {                    /* азимут от севера по часовой и высота -> вектор сцены */

const TIMES = {
  morning: { b: 118, el: 24, sun: 3.4, col: 0xfff3e0, hemi: 1.5, env: 1.1, exp: .78, fog: 0xd6e2ee, turb: 4, ray: 1.2, lamp: 0 },

/* ---------- живой вид за террасой ----------
   Вместо серой местности на юге показывается живой ролик вида с террасы (тот же, что на сайте).
   Ролик снят из точки (4.5, -2.75) на высоте глаз, взгляд на юг с наклоном -3°, вертикальный угол 64°.
   Он натянут на далёкий экран ровно под этот угол, по бокам стоят его зеркальные копии, чтобы вид не обрывался.
   Серая местность южнее фасада отсечена; на севере (окна на Ла-Кончу) она остаётся. */
renderer.localClippingEnabled = true;
const southCut = [new THREE.Plane(new THREE.Vector3(0, 0, -1), -1.5)];
const liveVid = document.createElement('video');
Object.assign(liveVid, { muted: true, loop: true, playsInline: true, preload: 'auto' }); liveVid.setAttribute('playsinline', ''); liveVid.setAttribute('muted', '');
const liveTex = new THREE.VideoTexture(liveVid); liveTex.colorSpace = THREE.SRGBColorSpace;
{
  const R = 900, vf = 64 * Math.PI / 180, vh = 2 * R * Math.tan(vf / 2), vw = vh * 16 / 9, half = Math.atan(Math.tan(vf / 2) * 16 / 9);
  const eye = new THREE.Group(); eye.position.copy(P(4.5, -2.75, EYE)); scene.add(eye);
  /* экран непрозрачный: иначе его не видно сквозь стекло дверей (стекло рисуется отдельным проходом) */
  const m = new THREE.MeshBasicMaterial({ map: liveTex, toneMapped: false, fog: false, side: THREE.DoubleSide });
  /* наклон общий для всех трёх частей, чтобы их края сходились без щели */
  const tilt = new THREE.Group(); tilt.rotation.x = 3 * Math.PI / 180; eye.add(tilt);
  for (const k of [-1, 0, 1]) {
    const yawG = new THREE.Group(); yawG.rotation.y = k * 2 * half; tilt.add(yawG);
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(vw, vh), m); scr.position.z = R; scr.rotation.y = Math.PI; if (k) scr.scale.x = -1; yawG.add(scr);
  }
  /* земля под нижним краем экрана: видна, только если смотреть с края террасы круто вниз */
  const gndM = new THREE.MeshBasicMaterial({ color: 0x55663a, fog: false, toneMapped: false });
  const gnd = new THREE.Mesh(new THREE.CircleGeometry(2600, 48), gndM);
  gnd.rotation.x = -Math.PI / 2; gnd.position.y = -R * Math.tan(vf / 2 + 3 * Math.PI / 180) + 6; eye.add(gnd);
  /* небо над верхним краем экрана: южная половина купола в цвет верхней кромки ролика, чтобы на стыках частей не было выреза */
  const domeM = new THREE.MeshBasicMaterial({ color: 0x9db7d8, fog: false, toneMapped: false, side: THREE.BackSide });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(R * 1.6, 32, 16, 0, Math.PI), domeM); eye.add(dome);
  /* цвета неба и земли берутся из самого ролика раз в секунду */
  const pc = document.createElement('canvas'); pc.width = 16; pc.height = 9; const px = pc.getContext('2d', { willReadFrequently: true });
  setInterval(() => { if (liveVid.readyState < 2) return; try { px.drawImage(liveVid, 0, 0, 16, 9);
    const a = px.getImageData(8, 0, 1, 1).data, b = px.getImageData(8, 8, 1, 1).data;
    domeM.color.setRGB(a[0] / 255, a[1] / 255, a[2] / 255, THREE.SRGBColorSpace); gndM.color.setRGB(b[0] / 255, b[1] / 255, b[2] / 255, THREE.SRGBColorSpace); } catch (e) {} }, 1000);
}
function liveView(k) { const src = '../vid/v/' + k + '.mp4'; if (liveVid.getAttribute('src') !== src) { liveVid.src = src; } liveVid.play().catch(() => {}); }
addEventListener('pointerdown', () => liveVid.play().catch(() => {}), { passive: true });

async function loadSite() {
  const d = await (await fetch('mestnost.json')).json(), { step, u0, v0, nu, nv, h } = d, lvl = UNIT.level;
  const pos = new Float32Array(nu * nv * 3), col = new Float32Array(nu * nv * 3), idx = [];
  const c1 = new THREE.Color(0x7d8757), c2 = new THREE.Color(0xb3a27c), c3 = new THREE.Color(0x5e6f48), c = new THREE.Color();
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const k = j * nu + i, z = h[k], n = (Math.sin(i * 12.9898 + j * 78.233) * 43758.5453) % 1;
    pos[k * 3] = u0 + i * step - UNIT.x0; pos[k * 3 + 1] = Math.max(z, -0.6) - lvl; pos[k * 3 + 2] = -(v0 + j * step);
    c.copy(c1).lerp(c2, Math.min(1, Math.abs(n) * .9)).lerp(c3, z > 60 ? .5 : 0); col.set([c.r, c.g, c.b], k * 3);
  }
  for (let j = 0; j < nv - 1; j++) for (let i = 0; i < nu - 1; i++) { const a = j * nu + i, b = a + 1, cc = a + nu, dd = cc + 1; idx.push(a, b, cc, b, dd, cc); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setIndex(idx); g.computeVertexNormals();
  landMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, clippingPlanes: southCut }); const land = new THREE.Mesh(g, landMat); land.receiveShadow = false; scene.add(land);
  seaMat = new THREE.MeshStandardMaterial({ color: 0x4f7f9a, roughness: .18, metalness: .1, clippingPlanes: southCut });
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(40000, 40000), seaMat); sea.rotation.x = -Math.PI / 2; sea.position.y = 0.15 - lvl; scene.add(sea);
  const gs = [];
  for (const [z, fl, r] of d.buildings) {
    const s = new THREE.Shape(); for (let i = 0; i < r.length; i += 2) i ? s.lineTo(r[i] - UNIT.x0, r[i + 1]) : s.moveTo(r[i] - UNIT.x0, r[i + 1]);
    const e = new THREE.ExtrudeGeometry(s, { depth: fl * 3.1 + 2.5, bevelEnabled: false }); e.rotateX(-Math.PI / 2); e.translate(0, z - 2 - lvl, 0); gs.push(e);
  }
  bldMat = new THREE.MeshStandardMaterial({ color: 0xece5d6, roughness: .9, clippingPlanes: southCut });
  scene.add(new THREE.Mesh(mergeGeometries(gs), bldMat));
}

/* ---------- управление ---------- */
const pos = P(7.6, 8.25, EYE); let yaw = Math.PI * 0.72, pitch = -0.04;
const keys = {}, move = { x: 0, y: 0 };
addEventListener('keydown', e => { keys[e.code] = 1; if (e.code === 'KeyE' || e.code === 'Space') { e.preventDefault(); act(); } });
addEventListener('keyup', e => keys[e.code] = 0);
const cv = renderer.domElement, stick = document.getElementById('stick'); let look = null, mv = null, tapStart = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); tapStart = { x: e.clientX, y: e.clientY, t: performance.now() };
  if (e.pointerType !== 'mouse' && e.clientX < innerWidth * 0.42 && !mv) { mv = { id: e.pointerId, x: e.clientX, y: e.clientY }; stick.style.display = 'block'; stick.style.left = e.clientX + 'px'; stick.style.top = e.clientY + 'px'; stick.firstChild.style.transform = ''; }
  else if (!look) look = { id: e.pointerId, x: e.clientX, y: e.clientY };
});
cv.addEventListener('pointermove', e => {
  if (mv && e.pointerId === mv.id) { let dx = e.clientX - mv.x, dy = e.clientY - mv.y; const l = Math.hypot(dx, dy), m = 44; if (l > m) { dx *= m / l; dy *= m / l; } move.x = dx / m; move.y = dy / m; stick.firstChild.style.transform = `translate(${dx}px,${dy}px)`; }
  else if (look && e.pointerId === look.id) { const k = e.pointerType === 'mouse' ? 0.0032 : 0.0052; yaw -= (e.clientX - look.x) * k; pitch = Math.max(-1.2, Math.min(1.2, pitch - (e.clientY - look.y) * k)); look.x = e.clientX; look.y = e.clientY; }
});
const up = e => {
  if (mv && e.pointerId === mv.id) { mv = null; move.x = move.y = 0; stick.style.display = 'none'; }
  if (look && e.pointerId === look.id) look = null;
  if (tapStart && performance.now() - tapStart.t < 260 && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) < 8) tap(e.clientX, e.clientY);
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
const ray = new THREE.Raycaster();
function tap(x, y) {
  ray.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camera); ray.far = 4;
  const hit = ray.intersectObjects(apt.children, true).find(h => h.object.userData.door || h.object.material !== mat.glass);
  if (hit && hit.object.userData.door) toggle(hit.object.userData.door);
}
const toggle = d => d.target = d.target ? 0 : 1;
function nearDoor() { let best = null, bd = 1.9; for (const d of doors) { const dd = Math.hypot(d.mid.x - pos.x, d.mid.z - pos.z); if (dd < bd) { bd = dd; best = d; } } return best; }
function act() { const d = nearDoor(); if (d) toggle(d); }
document.getElementById('act').onclick = act;
document.getElementById('toTerrace').onclick = () => { doors.find(d => d.type === 'slide').target = 1; pos.copy(P(4.2, -1.9, EYE)); yaw = Math.PI; pitch = -0.03; };
document.getElementById('toStart').onclick = () => { pos.copy(P(7.6, 8.25, EYE)); yaw = Math.PI * 0.72; pitch = -0.04; };
document.querySelectorAll('#time button').forEach(b => b.onclick = () => setTime(b.dataset.t));
function blocked(x, z) {
  if (x < RAD || x > 9 - RAD || z > 3.5 - RAD || z < -15 + RAD) return true;
  for (const c of colliders) if ((!c.active || c.active()) && x > c.minX - RAD && x < c.maxX + RAD && z > c.minZ - RAD && z < c.maxZ + RAD) return true;
  return false;
}

/* ---------- мини-план ---------- */
const mapEl = document.getElementById('map'), k = 6;
mapEl.innerHTML = `<svg viewBox="-1 -1 ${9 * k + 2} ${18.5 * k + 2}">${ROOMS.map(([n, x, y, w, h], i) => `<rect data-i="${i}" x="${x * k}" y="${(15 - y - h) * k}" width="${w * k}" height="${h * k}" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.6)" stroke-width=".8"/>`).join('')}<rect x="${6.2 * k}" y="0" width="${2.8 * k}" height="${6 * k}" fill="rgba(255,255,255,.35)"/><circle id="me" r="3.2" fill="#fff"/><path id="dir" d="M0-7 L3 0 L-3 0Z" fill="#fff"/></svg>`;
const me = mapEl.querySelector('#me'), dirEl = mapEl.querySelector('#dir'), rects = [...mapEl.querySelectorAll('rect[data-i]')], roomEl = document.getElementById('room'), actBtn = document.getElementById('act'), hint = document.getElementById('hint');
hint.textContent = mobile ? W('touch') : W('keys');
setTimeout(() => hint.style.opacity = 0, 9000);

/* ---------- цикл ---------- */
const clock = new THREE.Clock(); let frames = 0, ft = 0; const fpsEl = document.getElementById('fps');
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  let fx = move.x + (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0), fz = move.y + (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  const l = Math.hypot(fx, fz); if (l > 1) { fx /= l; fz /= l; }
  if (l > 0.02) { const sp = 2.4 * dt, s = Math.sin(yaw), c = Math.cos(yaw), dx = (fx * c + fz * s) * sp, dz = (-fx * s + fz * c) * sp;
    if (!blocked(pos.x + dx, pos.z)) pos.x += dx; if (!blocked(pos.x, pos.z + dz)) pos.z += dz; }
  for (const d of doors) { if (d.open !== d.target) { d.open += Math.sign(d.target - d.open) * dt * 1.7; if (Math.abs(d.target - d.open) < 0.02) d.open = d.target; const e = d.open * d.open * (3 - 2 * d.open);
      if (d.type === 'hinge') d.g.rotation.y = e * 1.62 * d.dir; else d.g.position.x = d.x0 - e * (d.w - 0.08); } }
  camera.position.copy(pos); camera.rotation.set(0, 0, 0, 'YXZ'); camera.rotation.y = yaw; camera.rotation.x = pitch;
  const ux = pos.x, uy = -pos.z, ri = ROOMS.findIndex(([n, x, y, w, h]) => ux >= x && ux <= x + w && uy >= y && uy <= y + h);
  if (ri >= 0) roomEl.textContent = W(ROOMS[ri][0]); rects.forEach((r, i) => r.setAttribute('fill', i === ri ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.14)'));
  me.setAttribute('cx', ux * k); me.setAttribute('cy', (15 - uy) * k); dirEl.setAttribute('transform', `translate(${ux * k},${(15 - uy) * k}) rotate(${-yaw * 180 / Math.PI})`);
  const nd = nearDoor(); actBtn.hidden = !nd; if (nd) actBtn.textContent = W(nd.target ? 'Закрыть: ' : 'Открыть: ') + W(nd.name);
  renderer.render(scene, camera);
  frames++; ft += dt; if (ft > 1) { fpsEl.textContent = Math.round(frames / ft) + W(' кадр/с'); frames = 0; ft = 0; }
  requestAnimationFrame(tick);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.fov = mobile && innerHeight > innerWidth ? 78 : 68; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
/* ссылка на точку: #x,y,поворот,наклон,время — например #2.6,3,180,0,morning */
const hp = location.hash.slice(1).split(',');
if (hp.length >= 2 && !isNaN(+hp[0])) { pos.copy(P(+hp[0], +hp[1], EYE)); if (hp[2]) yaw = +hp[2] * Math.PI / 180; if (hp[3]) pitch = +hp[3] * Math.PI / 180; if (+hp[1] < 0.5) doors.find(d => d.type === 'slide').open = doors.find(d => d.type === 'slide').target = 1; }
addEventListener('hashchange', () => location.reload());
setTime(TIMES[hp[4]] ? hp[4] : 'sunset');
loadSite().catch(e => { document.getElementById('loadmsg').textContent = W('местность не загрузилась: ') + e.message; }).finally(() => { document.getElementById('load').style.display = 'none'; });
window.__eclipse = { pos, doors, colliders, setTime, blocked, get yaw() { return yaw; }, set yaw(v) { yaw = v; }, set pitch(v) { pitch = v; }, renderer, P };
tick();
