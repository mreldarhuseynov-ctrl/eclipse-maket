<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Eclipse — тур по квартире 3C</title>
<style>
  :root { --ink: #f4ede2; --bronze: #c9a574; --bg: #14110e; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .frame { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
  .frame img, .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s ease; }
  .frame .on { opacity: 1; }
  .shade { position: absolute; inset: auto 0 0 0; height: 38%; background: linear-gradient(transparent, rgba(12, 9, 6, .72)); pointer-events: none; }
  .top { position: absolute; left: 0; right: 0; top: 0; padding: max(14px, env(safe-area-inset-top)) 18px 0; display: flex; justify-content: space-between; align-items: baseline; text-shadow: 0 1px 12px rgba(0, 0, 0, .6); pointer-events: none; }
  .brand { letter-spacing: .34em; font-size: 13px; color: inherit; text-decoration: none; pointer-events: auto; padding: 8px 8px 8px 0; }
  .where { font-size: 13px; opacity: .85; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 14px max(14px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; transition: opacity .4s ease; }
  .bar.off { opacity: 0; pointer-events: none; }
  button { font: inherit; font-size: 14px; color: var(--ink); background: rgba(20, 17, 14, .55); border: 1px solid rgba(201, 165, 116, .55); border-radius: 999px; padding: 10px 16px; min-height: 44px; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  button:hover, button:focus-visible { background: var(--bronze); color: #1b1611; outline: none; }
  button.back { border-color: rgba(244, 237, 226, .5); }
  .note { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 10px; opacity: .45; pointer-events: none; }
  /* телефон вертикально: кнопки под кадром, а не поверх него */
  @media (orientation: portrait) { .frame { overflow: visible; } .shade { display: none; } .bar { top: 100%; bottom: auto; padding: 16px 12px 0; } }
  @media (max-width: 560px) { button { font-size: 13px; padding: 9px 13px; } .brand { font-size: 11px; } }
</style>
</head>
<body>
<div class="stage">
  <div class="frame">
    <img id="still" class="on" src="img/hub.jpg" alt="">
    <video id="clip" playsinline muted preload="auto"></video>
    <div class="shade"></div>
    <div class="top"><a class="brand" id="home" href="../index.html#/unit/3C">← ECLIPSE</a><span class="where" id="where"></span></div>
    <div class="bar" id="bar"></div>
  </div>
</div>
<script>
/* языки: тот же выбор, что на основном сайте (ссылка ?lang= или память браузера) */
const T = {
  ru: { title: 'Eclipse — тур по квартире 3C', apt: 'Квартира 3C', hub: 'Гостиная', back: '← В гостиную', home: 'Назад к квартире 3C',
        terrasa: 'Терраса', kuhnya: 'Кухня', spalnya1: 'Спальня 1', spalnya2: 'Спальня 2', vannaya1: 'Ванная' },
  en: { title: 'Eclipse — tour of apartment 3C', apt: 'Apartment 3C', hub: 'Living room', back: '← Living room', home: 'Back to apartment 3C',
        terrasa: 'Terrace', kuhnya: 'Kitchen', spalnya1: 'Bedroom 1', spalnya2: 'Bedroom 2', vannaya1: 'Bathroom' },
  es: { title: 'Eclipse — recorrido por el apartamento 3C', apt: 'Apartamento 3C', hub: 'Salón', back: '← Salón', home: 'Volver al apartamento 3C',
        terrasa: 'Terraza', kuhnya: 'Cocina', spalnya1: 'Dormitorio 1', spalnya2: 'Dormitorio 2', vannaya1: 'Baño' }
};
function pickLang() { const m = location.search.match(/[?&]lang=(ru|en|es)/); if (m) return m[1];
  try { if (T[localStorage.eclLang]) return localStorage.eclLang; } catch (e) {}
  const n = (navigator.language || 'en').slice(0, 2).toLowerCase(); return T[n] ? n : 'en'; }
const LANG = pickLang(), L = T[LANG];
document.documentElement.lang = LANG; document.title = L.title;
const ROOMS = ['terrasa', 'kuhnya', 'spalnya1', 'spalnya2', 'vannaya1'].map(id => ({ id, name: L[id] }));
const still = document.getElementById('still'), clip = document.getElementById('clip'),
  bar = document.getElementById('bar'), where = document.getElementById('where');
const wait = ms => new Promise(r => setTimeout(r, ms));
let busy = false;

/* заранее грузим картинки, чтобы смена кадра не моргала */
['img/hub.jpg', ...ROOMS.flatMap(r => ['img/' + r.id + '-start.jpg', 'img/' + r.id + '-end.jpg'])].forEach(s => { new Image().src = s; });

function buttons(list) {
  bar.innerHTML = '';
  for (const b of list) { const e = document.createElement('button'); e.textContent = b.label; if (b.back) e.className = 'back'; e.onclick = b.go; bar.appendChild(e); }
  bar.classList.remove('off');
}
function setStill(src) { return new Promise(res => { const i = new Image(); i.onload = i.onerror = () => { still.src = src; res(); }; i.src = src; }); }

function hub() {
  where.textContent = L.apt + ' · ' + L.hub;
  buttons(ROOMS.map(r => ({ label: r.name, go: () => enter(r) })));
}
async function enter(r) {
  if (busy) return; busy = true; bar.classList.add('off');
  where.textContent = L.apt + ' · ' + r.name;
  /* 1. мягко меняем кадр гостиной на первый кадр перехода */
  still.classList.remove('on'); await wait(600);
  await setStill('img/' + r.id + '-start.jpg'); still.classList.add('on'); await wait(650);
  /* 2. играем переход поверх стоп-кадра */
  clip.src = 'v/' + r.id + '.mp4';
  try {
    await new Promise((res, rej) => { clip.oncanplay = res; clip.onerror = rej; clip.load(); });
    clip.style.transition = 'none'; clip.classList.add('on'); await clip.play();
    await new Promise(res => { clip.onended = res; });
  } catch (e) { /* видео не сыграло: просто покажем комнату */ }
  /* 3. подменяем на последний кадр и убираем видео */
  await setStill('img/' + r.id + '-end.jpg'); await wait(60);
  clip.classList.remove('on'); clip.style.transition = '';
  buttons([{ label: L.back, back: true, go: back }]);
  busy = false;
}
async function back() {
  if (busy) return; busy = true; bar.classList.add('off');
  still.classList.remove('on'); await wait(600);
  await setStill('img/hub.jpg'); still.classList.add('on'); await wait(600);
  busy = false; hub();
}
const home = document.getElementById('home'); home.setAttribute('aria-label', L.home); home.href = '../index.html?lang=' + LANG + '#/unit/3C';
still.alt = L.apt + ' · ' + L.hub;
hub();
</script>
</body>
</html>
